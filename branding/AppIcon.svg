<?xml version="1.0" encoding="UTF-8"?>
<!--
    TeklaLookup application icon.

    Design language follows SmartSelect: flat shapes on a transparent canvas,
    Tekla parts drawn gray (#B6C2D1), and the "active" object lit up in the brand
    blue gradient (#3B82F6 -> #1D4FD7).

    Subject: a flat steel I-beam (IPE cross-section) with a magnifying glass over it.
    The slice of beam inside the lens lights up in an amber accent — distinct from the
    blue lens, so it reads as the "lookup hit" the tool is for.

    Master SVG; the .ico is generated by branding/Build-AppIcon.ps1 (it re-draws the
    same shapes via WPF, so no SVG rasterizer is needed). Keep the two in sync — the
    beam polygons come from that script's `-EmitSvg` output.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="TeklaLookup logo (magnifier over a steel I-beam)">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4FD7"/>
    </linearGradient>
    <!-- Amber accent for the beam slice under the glass (the lookup hit). -->
    <linearGradient id="hit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <!-- Lens interior: only the slice of beam under the glass lights up. -->
    <clipPath id="lens">
      <circle cx="150" cy="116" r="56"/>
    </clipPath>
  </defs>

  <!-- Flat I-beam: gray, then the lens slice re-drawn in the amber accent. -->
  <polygon points="104,16 196,16 196,44 166,44 166,188 196,188 196,216 104,216 104,188 134,188 134,44 104,44" fill="#B6C2D1"/>
  <polygon points="104,16 196,16 196,44 166,44 166,188 196,188 196,216 104,216 104,188 134,188 134,44 104,44" fill="url(#hit)" clip-path="url(#lens)"/>

  <!-- Magnifying glass: handle first (its round cap tucks under the ring so it
       doesn't poke into the glass), then the lens ring. -->
  <line x1="193" y1="163" x2="232" y2="206"
        stroke="url(#blue)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="150" cy="116" r="56" fill="#FFFFFF" fill-opacity="0.10"
          stroke="url(#blue)" stroke-width="16"/>
</svg>
