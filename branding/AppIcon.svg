<?xml version="1.0" encoding="UTF-8"?>
<!--
    TeklaLookup application icon.
    Design: blue rounded-square frame with a dark magnifying-glass silhouette centered.
    Master SVG; the actual .ico is generated by branding/Build-AppIcon.ps1 (it re-draws
    the same shapes via System.Drawing so we don't need an external SVG rasterizer).
    Keep the two in sync if you change the design.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Blue rounded frame -->
  <rect x="0" y="0" width="256" height="256" rx="44" ry="44" fill="#0079C2"/>
  <!-- White inner panel -->
  <rect x="18" y="18" width="220" height="220" rx="30" ry="30" fill="#FFFFFF"/>
  <!-- Magnifying glass silhouette -->
  <g fill="none" stroke="#1F1F1F" stroke-linecap="round">
    <!-- Lens ring -->
    <circle cx="108" cy="108" r="44" stroke-width="18"/>
    <!-- Handle -->
    <line x1="142" y1="142" x2="198" y2="198" stroke-width="22"/>
  </g>
</svg>
